<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pocket World — Interactive 3D Miniature Floating Island</title>
    <meta name="description" content="A polished, interactive 3D diorama of a tiny floating island built with Three.js and TypeScript." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
    <script>
      window.__LOGS__ = [];
      window.addEventListener('error', function(e) {
        var msg = 'ERR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        window.__LOGS__.push(msg);
        console.error(msg);
      });
    </script>
  </head>
  <body>
    <!-- 3D Canvas Mount Point -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Mount Point -->
    <div id="ui-root"></div>

    <!-- Application Script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
