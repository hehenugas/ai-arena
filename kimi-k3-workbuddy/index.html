<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a26" />
    <title>Pocket World</title>
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Pocket World 3D scene"></canvas>

    <aside id="panel" class="panel" aria-label="Pocket World controls">
      <header class="panel__header">
        <h1 class="panel__title">Pocket World</h1>
        <button id="panel-toggle" class="panel__toggle" aria-expanded="true" aria-controls="panel-body" title="Collapse panel">
          <span aria-hidden="true">–</span>
        </button>
      </header>

      <div id="panel-body" class="panel__body">
        <div class="control">
          <label for="time-slider">Time of day <output id="time-label" for="time-slider">16:00</output></label>
          <input id="time-slider" type="range" min="0" max="1439" step="1" value="960" aria-label="Time of day" />
        </div>

        <div class="control">
          <span class="control__label" id="weather-label">Weather</span>
          <div class="segmented" role="group" aria-labelledby="weather-label">
            <button id="weather-clear" class="segmented__btn is-active" type="button" aria-pressed="true">Clear</button>
            <button id="weather-rain" class="segmented__btn" type="button" aria-pressed="false">Rain</button>
          </div>
        </div>

        <div class="control">
          <label for="wind-slider">Wind <output id="wind-label" for="wind-slider">30%</output></label>
          <input id="wind-slider" type="range" min="0" max="100" step="1" value="30" aria-label="Wind strength" />
        </div>

        <div class="control control--row">
          <label class="switch">
            <input id="lights-toggle" type="checkbox" />
            <span class="switch__track" aria-hidden="true"></span>
            <span>House lights</span>
          </label>
        </div>

        <button id="reset-btn" class="reset" type="button">Reset world</button>

        <p class="hint">Drag to orbit · scroll to zoom · click the house to toggle its lights.</p>
      </div>
    </aside>

    <div id="fallback" class="fallback" hidden>
      <div>
        <h1>Pocket World</h1>
        <p>Sorry — this experience needs WebGL, which your browser could not provide.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
