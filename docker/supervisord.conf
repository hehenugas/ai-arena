; ==============================================================================
; AI Arena: supervisord inside the single `arena` container
; ==============================================================================
; Installed as /etc/supervisord.conf (see Dockerfile), which is also where
; supervisorctl looks by default, so `supervisorctl status` needs no arguments.
;
; 19 programs: Caddy (the router, and the only published port) plus one busybox
; httpd static server per model on 5101-5118.
;
; The static programs are NOT written here: the image build runs
; docker/gen-models-conf.mjs, which turns every entry in aggregator/models.json
; into a [program:static-<model>] block in /etc/supervisor.d/models.conf, so a
; port can never disagree with the port map in PORT_RULES.md.
;
;   docker compose exec arena supervisorctl status
;   docker compose logs -f arena
; ==============================================================================

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
; supervisord's own log goes to the container output, so a crashed program or a
; restart backoff shows up in `docker compose logs` even though the static
; servers log nothing themselves.
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ------------------------------------------------------------------------------
; Caddy: router for /<model>/ and the aggregator dashboard on :8080
; ------------------------------------------------------------------------------
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /etc/supervisor.d/*.conf
