# ==============================================================================
# AI Arena: one container, Caddy + 26 static servers under supervisord
# ==============================================================================
#   docker compose up -d --build                → http://localhost:8080/
#   docker compose exec arena supervisorctl status
#   docker compose logs -f arena
#
# Only :8080 is published. The model servers listen on 127.0.0.1:5101-5126
# inside the container and are reached by Caddy, never from the host. They are
# generated from aggregator/models.json at image build time (see Dockerfile).
#
# Local (non-Docker) equivalent: ./arena.sh --start
# ==============================================================================

name: ai-arena

services:
  arena:
    build:
      context: .
    image: ai-arena
    restart: unless-stopped
    ports:
      - "${ARENA_PORT:-8080}:8080"
    volumes:
      # Optional, for dashboard work: edit aggregator/ and refresh instead of
      # rebuilding. The 27 model builds are baked into the image.
      - ./aggregator:/srv/aggregator:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
