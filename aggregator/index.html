<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Arena</title>
    <meta
      name="description"
      content="Local console for the model frontends served through one Caddy route on :8080."
    />
    <!-- Placeholder mark: a route slash. Replace it when there is a real one. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f8f4ed'/%3E%3Cpath d='M21 5 11 27' stroke='%23a32b3f' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./app.css?v=2" />
    <script>
      // Resolve the theme before first paint so the page never flashes the other mode.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ai-arena-theme");
        } catch (err) {
          saved = null;
        }
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.dataset.theme = "dark";
      })();
    </script>
  </head>

  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="bar">
      <div class="bar__inner">
        <div class="mark">
          <span class="mark__name">AI Arena</span>
          <span class="mark__host" id="hostLabel">…</span>
        </div>

        <nav class="tabs" role="tablist" aria-label="Views">
          <button
            class="tab"
            role="tab"
            id="tab-index"
            aria-controls="view-index"
            aria-selected="true"
            tabindex="0"
            title="Shortcut: 1"
          >
            Index <kbd aria-hidden="true">1</kbd>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-duo"
            aria-controls="view-duo"
            aria-selected="false"
            tabindex="-1"
            title="Shortcut: 2"
          >
            Side by side <kbd aria-hidden="true">2</kbd>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-quad"
            aria-controls="view-quad"
            aria-selected="false"
            tabindex="-1"
            title="Shortcut: 3"
          >
            Four up <kbd aria-hidden="true">3</kbd>
          </button>
        </nav>

        <div class="bar__tools">
          <span class="counter" id="liveCounter">loading</span>
          <button class="btn" id="recheckBtn" title="Shortcut: R">
            Recheck <kbd aria-hidden="true">R</kbd>
          </button>
          <button class="btn" id="themeBtn" role="switch" aria-checked="false" aria-label="Dark mode">
            Dark
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ================================================================
           Index: the roster of every route
           ================================================================ -->
      <section
        class="view is-active"
        id="view-index"
        role="tabpanel"
        aria-labelledby="tab-index"
        tabindex="-1"
      >
        <div class="view__head">
          <h2 class="view__title">Index</h2>
          <p class="view__note">
            Every model folder behind this Caddy route, with its live status.
          </p>
        </div>

        <div class="wrap">
          <label class="picker">
            <span class="eyebrow">Search</span>
            <input
              class="field"
              type="search"
              id="searchInput"
              placeholder="name, folder, port"
            />
          </label>

          <label class="picker">
            <span class="eyebrow">Provider</span>
            <select class="field" id="tagFilter"></select>
          </label>

          <label class="picker">
            <span class="eyebrow">Status</span>
            <select class="field" id="statusFilter">
              <option value="ALL">Any</option>
              <option value="UP">Up</option>
              <option value="DOWN">Down</option>
            </select>
          </label>

          <button class="btn" id="clearFilters" disabled>Clear filters</button>
          <span class="wrap__count" id="indexCount"></span>
        </div>

        <div id="indexBody"></div>
      </section>

      <!-- ================================================================
           Side by side
           ================================================================ -->
      <section
        class="view view--frames"
        id="view-duo"
        role="tabpanel"
        aria-labelledby="tab-duo"
        tabindex="-1"
      >
        <div class="strip">
          <div class="picker">
            <span class="eyebrow">Left</span>
            <select class="field" id="selectModelA" aria-label="Left pane model"></select>
          </div>

          <button class="btn" id="swapPanes" title="Swap the two panes">Swap</button>

          <div class="picker">
            <span class="eyebrow">Right</span>
            <select class="field" id="selectModelB" aria-label="Right pane model"></select>
          </div>

          <div class="picker">
            <span class="eyebrow">Width</span>
            <select class="field" id="frameWidth" aria-label="Preview width">
              <option value="desktop">Full width</option>
              <option value="tablet">768 px</option>
              <option value="mobile">375 px</option>
            </select>
          </div>

          <div class="strip__end">
            <button class="btn" id="reloadDuo">Reload both</button>
          </div>
        </div>

        <div class="frames frames--duo">
          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">A</span>
              <div class="frame__ident" id="identA">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="A">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="A">Open in tab</button>
              </div>
            </header>
            <div class="frame__viewport" id="wrapFrameA" data-width="desktop">
              <iframe id="frameA" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>

          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">B</span>
              <div class="frame__ident" id="identB">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="B">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="B">Open in tab</button>
              </div>
            </header>
            <div class="frame__viewport" id="wrapFrameB" data-width="desktop">
              <iframe id="frameB" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>
        </div>
      </section>

      <!-- ================================================================
           Four up
           ================================================================ -->
      <section
        class="view view--frames"
        id="view-quad"
        role="tabpanel"
        aria-labelledby="tab-quad"
        tabindex="-1"
      >
        <div class="strip">
          <div class="picker">
            <span class="eyebrow">Q1</span>
            <select class="field" id="selectQuad1" aria-label="Frame 1 model"></select>
          </div>
          <div class="picker">
            <span class="eyebrow">Q2</span>
            <select class="field" id="selectQuad2" aria-label="Frame 2 model"></select>
          </div>
          <div class="picker">
            <span class="eyebrow">Q3</span>
            <select class="field" id="selectQuad3" aria-label="Frame 3 model"></select>
          </div>
          <div class="picker">
            <span class="eyebrow">Q4</span>
            <select class="field" id="selectQuad4" aria-label="Frame 4 model"></select>
          </div>

          <div class="strip__end">
            <button class="btn" id="reloadQuad">Reload all</button>
          </div>
        </div>

        <div class="frames frames--quad">
          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">Q1</span>
              <div class="frame__ident" id="identQ1">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="Q1">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="Q1">Open</button>
              </div>
            </header>
            <div class="frame__viewport" data-width="desktop">
              <iframe id="frameQ1" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>

          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">Q2</span>
              <div class="frame__ident" id="identQ2">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="Q2">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="Q2">Open</button>
              </div>
            </header>
            <div class="frame__viewport" data-width="desktop">
              <iframe id="frameQ2" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>

          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">Q3</span>
              <div class="frame__ident" id="identQ3">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="Q3">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="Q3">Open</button>
              </div>
            </header>
            <div class="frame__viewport" data-width="desktop">
              <iframe id="frameQ3" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>

          <article class="frame">
            <header class="frame__head">
              <span class="frame__no">Q4</span>
              <div class="frame__ident" id="identQ4">
                <span class="frame__name">No model selected</span>
              </div>
              <div class="frame__acts">
                <button class="btn" data-act="reload-frame" data-slot="Q4">Reload</button>
                <button class="btn" data-act="open-frame" data-slot="Q4">Open</button>
              </div>
            </header>
            <div class="frame__viewport" data-width="desktop">
              <iframe id="frameQ4" title="Model preview" src="about:blank"></iframe>
            </div>
          </article>
        </div>
      </section>

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js?v=2" defer></script>
  </body>
</html>
